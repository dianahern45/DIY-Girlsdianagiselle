<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Assistant Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==============================================
         STUDENTS: EDIT THIS HEADER!
         ============================================== -->
    <div class="header">
        <div class="header__badge" aria-hidden="true"></div>
        <h1>mila</h1>
        <p>Built by: diana and giselle </p>
        <span class="header__status">Online &amp; ready</span>
    </div>

    <div class="container">
        <!-- Configuration Panel -->
        <!-- Hidden from visitors. The fields below stay in the page because
             script.js reads the system prompt and welcome message from them. -->
        <div class="config-panel" hidden>
            <!-- <h2>⚙️ Configure Your Assistant</h2>

            <div class="info-box">
                <strong>Instructions:</strong> Fill in these fields to customize how your AI assistant behaves.
            </div> -->

            <div class="config-section">
                <label for="assistantName">Assistant Name:</label>
                <input
                    type="text"
                    id="assistantName"
                    placeholder="e.g., TrailGuide, StudyBuddy, CampingPro"
                    value="MyAssistant"
                >
            </div>

            <div class="config-section">
                <label for="systemPrompt">System Prompt (What should your assistant do?):</label>
                <textarea
                    id="systemPrompt"
                    placeholder="Example: You are a helpful trail safety advisor. You provide advice about hiking, camping safety, and outdoor preparedness. Always be encouraging and emphasize safety first."
                >Your name is mila and your sole purpose is to be a studybuddy for any subjects.
                You are helping students in highschool and college needing to understand their subjevts. They may not understand the way their teacher taught it. 
                Be warm and welcoming. Keep the answers/responses, short, concise, but still hitting the main points.
                Help reteach students w/whatever subject they are struggling in and help students to study using a technique/method they understand.
                Never directly give students answers, always help them, guide them, or work with them.
                "To be honest, I don't know. Try rewritting it another way or check your spelling."
            </div>

            <div class="config-section">
                <label for="welcomeMessage">Welcome Message:</label>
                <input
                    type="text"
                    id="welcomeMessage"
                    placeholder="What should your assistant say when it starts?"
                    value="Hello! How can I help you today?"
                >
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your message here..."
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
